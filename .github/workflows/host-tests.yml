name: HORATIO-1 host tests

on:
  push:
    branches:
      - main
      - horatio1-development
  pull_request:
    branches:
      - main

concurrency:
  group: horatio1-host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install generator dependency
        run: python -m pip install --upgrade Pillow
      - name: Validate the HORATIO-1 source bank
        run: python tools/validate_horatio1_bank.py
      - name: Run host test suite
        env:
          HOST_ONLY: '1'
          SKIP_CPU_VALGRIND: '1'
        run: sh tests/run_tests.sh